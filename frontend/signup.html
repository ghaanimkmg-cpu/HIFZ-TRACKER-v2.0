<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ZaryahPlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-branding">
      <div class="brand-zaryah">ZARYAHPLUS</div>
      <h1 class="brand-title">HIFZ TRACKER</h1>
      <p class="brand-desc">Secure coordinator access for Hifz student management.</p>
    </div>
    
    <div class="auth-form-wrapper">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join the coordinator portal</p>
      </div>
      
      <div id="auth-error" class="auth-error"></div>
      
      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" autocomplete="username" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" autocomplete="new-password" required>
        </div>
        
        <button type="submit" id="signup-btn" class="btn-submit">Create Account</button>
      </form>
      
      <div class="auth-links">
        <div>Already have an account? <a href="login.html">Sign In</a></div>
      </div>
    </div>
  </div>

  <script src="auth.js?v=3"></script>
</body>
</html>
