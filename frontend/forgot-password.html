<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — ZaryahPlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container">
    
    <!-- Branding Side -->
    <div class="auth-branding">
      <div class="brand-zaryah">ZaryahPlus</div>
      <h1 class="brand-title">HIFZ TRACKER</h1>
      <p class="brand-desc">Secure coordinator access for Hifz student management.</p>
    </div>

    <!-- Form Side -->
    <div class="auth-form-wrapper">
      <div class="auth-header">
        <h2>Forgot Password</h2>
        <p>Enter your username to receive a reset token.</p>
      </div>

      <div id="auth-error" class="auth-error"></div>
      
      <!-- SUCCESS BOX FOR PROTOTYPING -->
      <div id="success-msg" class="auth-error" style="display: none; background: rgba(201, 168, 76, 0.1); border-color: var(--auth-gold); color: var(--auth-gold); font-size: 13px; line-height: 1.5; word-break: break-all;">
      </div>

      <form id="forgot-password-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" autocomplete="username" required>
        </div>
        
        <button type="submit" id="forgot-btn" class="btn-submit">Request Reset Token</button>
      </form>
      
      <div class="auth-links">
        Remembered your password? <a href="login.html">Sign In</a>
      </div>
    </div>
    
  </div>

  <script src="auth.js"></script>
</body>
</html>
