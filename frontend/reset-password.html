<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — ZaryahPlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container">
    
    <!-- Branding Side -->
    <div class="auth-branding">
      <div class="brand-zaryah">ZaryahPlus</div>
      <h1 class="brand-title">HIFZ TRACKER</h1>
      <p class="brand-desc">Secure coordinator access for Hifz student management.</p>
    </div>

    <!-- Form Side -->
    <div class="auth-form-wrapper">
      <div class="auth-header">
        <h2>Reset Password</h2>
        <p>Enter your reset token and new password.</p>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <form id="reset-password-form" class="auth-form">
        <!-- Hidden username field: tells Chrome what username this password belongs to.
             Populated by JS after the user requests their token on forgot-password.html. -->
        <input type="text" id="rp-username" name="username" autocomplete="username"
               style="display:none" tabindex="-1" aria-hidden="true">

        <div class="form-group">
          <label class="form-label" for="token">Reset Token</label>
          <!-- autocomplete="off" prevents Chrome treating the token as a username -->
          <input type="text" id="token" name="token" class="form-input"
                 autocomplete="off" spellcheck="false" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" class="form-input"
                 autocomplete="new-password" required>
        </div>
        
        <button type="submit" id="reset-btn" class="btn-submit">Reset Password</button>
      </form>
      
      <div class="auth-links">
        Return to <a href="login.html">Sign In</a>
      </div>
    </div>
    
  </div>

  <script src="auth.js"></script>
</body>
</html>
